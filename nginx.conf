server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Same-origin proxies to the APIs, generated on startup from the proxy map.
    # Matching nothing is fine — then there simply are no proxied prefixes.
    include /etc/nginx/app-proxy/*.conf;

    # hashed assets can be cached hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html carries the runtime config, so it must never be cached
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
