{{- $cloudProviderFlavor := include "geo-query-ui.cloudProviderFlavor" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geo-query-ui.fullname" . }}
  labels:
    {{- include "geo-query-ui.labels" . | nindent 4 }}
spec:
  {{- if eq $cloudProviderFlavor "minikube" }}
  type: NodePort
  {{- else }}
  type: {{ .Values.service.type }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.env.port }}
      targetPort: http
      protocol: {{ .Values.env.protocol }}
      {{- if eq $cloudProviderFlavor "minikube" }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
  selector:
    {{- include "geo-query-ui.selectorLabels" . | nindent 4 }}
{{- end -}}
