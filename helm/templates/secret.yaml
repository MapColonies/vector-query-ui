{{- $keys := compact (list .Values.env.api.apiKey .Values.env.wfs.apiKey .Values.env.wmts.apiKey) -}}
{{- if and .Values.enabled .Values.secret.create (or .Values.secret.data $keys) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geo-query-ui.fullname" . }}
  labels:
    {{- include "geo-query-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.env.api.apiKey }}
  API_KEY: {{ tpl (toString .) $ | quote }}
  {{- end }}
  {{- with .Values.env.wfs.apiKey }}
  WFS_API_KEY: {{ tpl (toString .) $ | quote }}
  {{- end }}
  {{- with .Values.env.wmts.apiKey }}
  WMTS_API_KEY: {{ tpl (toString .) $ | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secret.data }}
  {{ $name }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end -}}
