# Replaces the image's /etc/nginx/nginx.conf.
#
# Two things the stock one gets wrong for OpenShift, where the container runs as
# an arbitrary non-root UID in group 0:
#
#   * `user nginx;` only means anything to a root master process. As a plain
#     user nginx warns "the user directive makes no sense in a non-superuser
#     context" and ignores it — so it is simply gone from here.
#   * `worker_processes auto;` counts the CPUs of the *node*, not the pod's
#     limit. On a large node that forks dozens of workers, each with its own
#     memory, and the pod is OOM-killed long before any of them are useful.
#     This serves static files and proxies a couple of APIs; one worker is
#     plenty, and it is a number rather than `auto` on purpose.
#
# Everything that nginx writes to also moves to /tmp, which is writable
# whatever UID the platform picks.

worker_processes 1;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
